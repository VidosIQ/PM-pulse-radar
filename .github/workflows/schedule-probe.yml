name: Temporary schedule diagnostic
on:
  push:
    paths:
      - '.github/workflows/schedule-probe.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record trigger and UTC time
        env:
          TRIGGER: ${{ github.event_name }}
          TIMER: ${{ github.event.schedule }}
        run: |
          echo "Trigger: $TRIGGER"
          echo "Schedule: $TIMER"
          date -u '+UTC: %Y-%m-%d %H:%M:%S'
